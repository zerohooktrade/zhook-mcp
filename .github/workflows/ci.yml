name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # This package depends on @zhooktrade/sdk via `file:../zhook-sdk`, a sibling folder. CI checks each repo out in
    # isolation, so the SDK is checked out and built next to it:
    #   <workspace>/main       -> this repo
    #   <workspace>/zhook-sdk  -> the SDK, so `../zhook-sdk` resolves.
    defaults:
      run:
        working-directory: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: main

      - name: Checkout SDK (file:../zhook-sdk dependency)
        uses: actions/checkout@v4
        with:
          repository: zhooktrade/zhook-sdk
          path: zhook-sdk

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: main/pnpm-lock.yaml

      - name: Build SDK dependency
        working-directory: zhook-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
